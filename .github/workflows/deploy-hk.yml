name: Deploy Hong Kong

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- src/lib/resource-form.test.ts src/lib/resource-queries.test.ts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.next' \
            --exclude='node_modules' \
            --exclude='.worktrees' \
            --exclude='.superpowers' \
            -czf research-hub-release.tgz .

      - name: Copy release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HK_SSH_HOST }}
          username: ${{ secrets.HK_SSH_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          source: research-hub-release.tgz
          target: /tmp

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HK_SSH_HOST }}
          username: ${{ secrets.HK_SSH_USER }}
          key: ${{ secrets.HK_SSH_KEY }}
          script: |
            set -eu
            APP_DIR="${{ secrets.HK_APP_DIR }}"
            RELEASE_DIR="$APP_DIR/current"
            mkdir -p "$APP_DIR"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf /tmp/research-hub-release.tgz -C "$RELEASE_DIR"
            cd "$RELEASE_DIR"
            npm ci
            npm run build
            sudo systemctl restart research-hub
